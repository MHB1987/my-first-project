<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profit Calculator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 30px;
    }

    .calculator {
      max-width: 400px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      box-sizing: border-box;
    }

    button {
      cursor: pointer;
      font-weight: bold;
    }

    #result {
      margin-top: 20px;
      font-size: 18px;
    }
  </style>
</head>

<body>

<div class="calculator">

  <h1>Profit Calculator</h1>

  <label>Investment (AED)</label>
  <input type="number" id="investment" placeholder="10000">

  <label>Profit (AED)</label>
  <input type="number" id="profit" placeholder="1500">

  <button onclick="calculateProfit()">Calculate</button>

  <div id="result"></div>

</div>

<script>
function calculateProfit() {

  const investment =
    Number(document.getElementById("investment").value);

  const profit =
    Number(document.getElementById("profit").value);

  if (investment <= 0) {
    document.getElementById("result").innerHTML =
      "Enter a valid investment amount.";
    return;
  }

  const percentage = (profit / investment) * 100;

  document.getElementById("result").innerHTML =
    "Profit: AED " + profit.toFixed(2) +
    "<br>Profit Percentage: " +
    percentage.toFixed(2) + "%";
}
</script>

</body>
</html>
